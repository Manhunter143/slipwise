<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slipwise</title>
<meta name="theme-color" content="#2446C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column; Groceries rides the big till-slip card, Baby Fund and Month-end sit side by side under it; bottom tab bar */
:root{
  --bg:#EDF0EE; --paper:#FFFFFF; --ink:#1B2420; --muted:#5E6B66; --line:#D5DCD8;
  --accent:#2446C9; --accent-ink:#FFFFFF; --hi:#F2E24A;
  --pot-g:#2446C9; --pot-b:#B0417A; --pot-x:#8A6400;
  --good:#1E7F4F; --warn:#A86400; --bad:#C0362C; --shade:rgba(20,28,25,.5);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111614; --paper:#1A211E; --ink:#E8EEEB; --muted:#93A19B; --line:#2C3531;
  --accent:#8FA6FF; --accent-ink:#0C1330; --hi:#D9C93A;
  --pot-g:#8FA6FF; --pot-b:#F08DBE; --pot-x:#E0B94A;
  --good:#4CC38A; --warn:#E3A33B; --bad:#F07166; --shade:rgba(0,0,0,.65); color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner{font-size:13px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.dot.groceries{background:var(--pot-g)} .dot.baby{background:var(--pot-b)} .dot.extras{background:var(--pot-x)}
.potname{display:flex;align-items:center;gap:7px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .label{min-width:9.5em;text-align:center;font-size:12px;color:var(--ink)}
.navbtn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:36px;height:36px;border-radius:50%;font:600 20px/1 var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 2px}
.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Groceries slip */
.slip{position:relative;background:var(--paper);padding:20px 18px 26px;border-radius:6px 6px 0 0;display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/14px 10px repeat-x,
             linear-gradient(-135deg,var(--paper) 50%,transparent 50%) 0 0/14px 10px repeat-x}
.slip .rule{border-top:1px dashed var(--line)}
.big{font-family:var(--f-mono);font-weight:600;font-size:clamp(30px,9.5vw,42px);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}
.meter{height:12px;border-radius:3px;background:var(--bg);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;display:block;background:var(--hi)}
.meter.baby i{background:var(--pot-b)}
.meter i.over{background:var(--bad)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}

/* Baby + Month-end cards */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:359px){.pair{grid-template-columns:1fr}}
.mini{background:var(--paper);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mini.baby{border-top:3px solid var(--pot-b)}
.mini.extras{border-top:3px solid var(--pot-x)}
.mini .amt{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.mini .sub{font-size:12px;color:var(--muted)}

/* Buttons & controls */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px var(--f-body);padding:13px 14px;border-radius:10px;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{grid-column:1/-1;padding:16px;font-size:16px}
.btn.danger{color:var(--bad)}
.btn.small{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.item:focus-visible,.seg button:focus-visible,.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px var(--f-body);padding:10px 6px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--paper);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg.two{grid-template-columns:1fr 1fr}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);font:600 12px var(--f-body);padding:6px 11px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--paper);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;color:inherit;font:inherit;width:100%}
.item:last-child{border-bottom:0}
.item .m{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.item .s{font-size:12px;color:var(--muted);grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .s svg{width:13px;height:13px}
.empty{background:var(--paper);border-radius:10px;padding:22px 18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:16px}

/* Sheet */
.card{background:var(--paper);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.potsum{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.potsum:first-of-type{border-top:0;padding-top:0}
.tablewrap{overflow-x:auto;background:var(--paper);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th:first-child,td:first-child{padding-left:12px;white-space:nowrap}
th:last-child,td:last-child{padding-right:12px;white-space:nowrap}
td{overflow-wrap:anywhere}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr[data-edit]{cursor:pointer}
tfoot td{font-weight:600;border-bottom:0}
tr.cur td{background:var(--bg)}
td.over{color:var(--bad)}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .pace{stroke:var(--muted);stroke-dasharray:4 4;fill:none;stroke-width:1.5}
svg.chart .spent{stroke:var(--pot-g);fill:none;stroke-width:2.5;stroke-linejoin:round}
svg.chart .area{fill:var(--pot-g);opacity:.12}
svg.chart .lim{stroke:var(--bad);stroke-width:1;opacity:.6}
svg.chart text{fill:var(--muted);font:10px var(--f-mono)}
svg.chart .dotp{fill:var(--pot-g)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:0;border-top:2px solid var(--pot-g);vertical-align:middle;margin-right:6px}
.legend span.p::before{border-top:2px dashed var(--muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .flabel{font-size:12px;font-weight:600;color:var(--muted)}
input,select{font:16px var(--f-body);padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
input.amtin{font-family:var(--f-mono);font-size:20px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.hint a{color:var(--accent)}

/* Modal sheet & viewer */
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.status{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--bg)}
.status.err{color:var(--bad)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.thumbbtn{align-self:center;background:none;border:0;padding:0;cursor:zoom-in}
.thumb{max-height:170px;width:auto;border-radius:6px;border:1px solid var(--line);display:block}
.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.viewer .img{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.viewer img{max-width:100%;height:auto}
.viewer .bar{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#111}
.viewer .bar .btn{flex:1;background:#222;color:#fff;border-color:#333}
details{font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
details ul{list-style:none;padding:8px 0 0;margin:0;display:flex;flex-direction:column;gap:4px}
details li{display:flex;justify-content:space-between;gap:10px}
details li span:first-child{min-width:0;overflow-wrap:anywhere}
details li span:last-child{font-family:var(--f-mono);white-space:nowrap}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:600 12px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer;border-radius:8px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/></svg>Budget</button>
  <button class="tab" data-tab="sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>Sheets</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
</div></nav>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gallery" accept="image/*" hidden>
<input type="file" id="restore-file" accept="application/json,.json" hidden>
<div id="modal"></div>
<div id="viewer"></div>
<div id="toastbox"></div>

<script>
(function(){
"use strict";
/* The three pots. Only Groceries and Baby Fund have limits; month-end payments just add up. */
const POTS={
  groceries:{name:"Groceries",short:"Groceries"},
  baby:{name:"Baby Fund",short:"Baby Fund"},
  extras:{name:"End of month payments",short:"Month-end"}
};
const POT_IDS=["groceries","baby","extras"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MODELS={"claude-haiku-4-5-20251001":"Claude Haiku 4.5 (cheapest, about R0.07 a slip)","claude-sonnet-5-5":"Claude Sonnet 5.5 (most accurate, about R0.15 a slip)"};
const DEFAULTS={groceriesLimit:0,babyLimit:0,babyMode:"monthly",babyFundStart:"",currency:"R",apiKey:"",model:"claude-haiku-4-5-20251001"};
const S={settings:Object.assign({},DEFAULTS),expenses:[],tab:"home",homeKey:null,filter:"all",sheetView:"month",sheetKey:null,sheetYear:null,ready:false,storageNote:""};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const dayDiff=(a,b)=>Math.round((b-a)/864e5);
/* Budget months are plain calendar months ("2026-09"). Each slip carries the month you picked for it. */
const ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
function period(date){
  const start=new Date(date.getFullYear(),date.getMonth(),1),next=new Date(date.getFullYear(),date.getMonth()+1,1);
  return {start,next,end:new Date(next.getFullYear(),next.getMonth(),0),key:ym(start),days:dim(start.getFullYear(),start.getMonth())};
}
const periodOfKey=k=>{const m=/^(\d{4})-(\d{2})/.exec(k||"");return period(m?new Date(+m[1],+m[2]-1,1):today())};
const periodForMonth=(y,m)=>period(new Date(y,m,1));
const monthName=p=>MONTHS[p.start.getMonth()]+" "+p.start.getFullYear();
const shiftKey=(k,n)=>{const p=periodOfKey(k);return ym(new Date(p.start.getFullYear(),p.start.getMonth()+n,1))};
const fmtD=d=>d.toLocaleDateString("en-ZA",{day:"numeric",month:"short"});
const fmtDY=d=>d.toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"});
function money(n){const v=Math.abs(n||0).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?"−":"")+(S.settings.currency||"R")+" "+v}
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?Math.round(n*100)/100:NaN};
function toast(msg){const b=$("#toastbox");b.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML="",2600)}
const potOf=e=>POTS[e.pot]?e.pot:"groceries";
// Which month a slip counts in: the month picked on the slip (older slips: the month they were captured)
const dayOf=ms=>{const d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const countDate=e=>parse(e.addedOn)||(e.createdAt?dayOf(e.createdAt):null)||parse(e.date)||today();
const monthOf=e=>/^\d{4}-\d{2}$/.test(e.month||"")?e.month:ym(countDate(e));
const inPeriod=p=>S.expenses.filter(e=>monthOf(e)===p.key);
const sum=a=>Math.round(a.reduce((t,e)=>t+(+e.amount||0),0)*100)/100;
const potSum=(list,pot)=>sum(list.filter(e=>potOf(e)===pot));
const newId=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fundMode=()=>S.settings.babyMode==="fund";
const fundStartKey=()=>(S.settings.babyFundStart||"2000-01").slice(0,7);
function babyFundSpent(){const from=fundStartKey();return potSum(S.expenses.filter(e=>monthOf(e)>=from),"baby")}
// Returns true when the Android app saved it (it shows its own "Saved" message)
async function saveFile(name,blob){
  if(window.AndroidBridge){window.AndroidBridge.saveFile(name,await blobToB64(blob),blob.type||"application/octet-stream");return true}
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return false;
}
// Android back button: close what's open, then go to the Budget tab, then leave the app
window.slipwiseBack=function(){
  if($("#viewer").innerHTML){const c=$("#vw-close");if(c)c.click();else $("#viewer").innerHTML="";return true}
  if($("#modal").innerHTML){const c=$("#ed-cancel");if(c)c.click();else $("#modal").innerHTML="";return true}
  if(S.tab!=="home"){S.tab="home";render();window.scrollTo(0,0);return true}
  return false;
};
const CAMERA_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Has photo"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

/* ---------- storage: everything stays on this phone (IndexedDB) ---------- */
let idb=null;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("slipwise",1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("expenses",{keyPath:"id"});d.createObjectStore("photos");d.createObjectStore("kv")};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=idb.transaction(store,mode),s=t.objectStore(store);let out;
  const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};
  t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
})}
const dbAll=store=>tx(store,"readonly",s=>s.getAll());
const dbGet=(store,key)=>tx(store,"readonly",s=>s.get(key));
const dbPut=(store,val,key)=>tx(store,"readwrite",s=>key===undefined?s.put(val):s.put(val,key));
const dbDel=(store,key)=>tx(store,"readwrite",s=>s.delete(key));
function migrateSettings(s){

/* ---------- photos ---------- */
async function prepPhoto(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height,k=Math.min(1,1568/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(res,"image/jpeg",0.85));
}

/* ---------- Claude API ---------- */
async function askClaude(content,maxTokens){
  const s=S.settings;let r;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "x-api-key":s.apiKey.trim(),"anthropic-version":"2023-06-01","content-type":"application/json",
      "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:s.model||DEFAULTS.model,max_tokens:maxTokens,messages:[{role:"user",content}]})});
  }catch(e){throw {code:"offline"}}
  let body=null;try{body=await r.json()}catch(e){}
  if(!r.ok){
    const msg=(body&&body.error&&body.error.message)||"";
    if(r.status===401) throw {code:"bad_key"};
    if(/credit balance/i.test(msg)) throw {code:"no_credit"};
    if(r.status===429) throw {code:"busy"};
    if(r.status===529||r.status>=500) throw {code:"overloaded"};
    if(r.status===404||/model/i.test(msg)) throw {code:"model"};
    throw {code:"other",message:msg};
  }
  return (body.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
}

function paceChart(p,list,lim,until){
  const W=320,H=150,L=44,R=10,T=12,B=22,iw=W-L-R,ih=H-T-B;
  const byDay=new Array(p.days).fill(0);
  // Slips chosen for this month but captured on another date sit on the first or last day
  list.forEach(e=>{const i=Math.max(0,Math.min(p.days-1,dayDiff(p.start,countDate(e))));byDay[i]+=+e.amount||0});
  const lastI=Math.max(0,Math.min(p.days-1,dayDiff(p.start,until)));
  let c=0;const cum=byDay.map(v=>c+=v);
  const top=Math.max(lim,cum[lastI]||0,1)*1.08;
  const x=i=>L+(p.days>1?i/(p.days-1):0)*iw,y=v=>T+ih-(v/top)*ih;
  const pts=[];for(let i=0;i<=lastI;i++)pts.push(x(i).toFixed(1)+","+y(cum[i]).toFixed(1));
  const k=v=>{const s=S.settings.currency||"R";return v>=1000?s+(v/1000).toFixed(v>=10000?0:1)+"k":s+Math.round(v)};
  let g="";[0,.5,1].forEach(f=>{if(!lim&&f)return;const v=lim*f;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${k(v)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Groceries spending so far compared with an even pace to the limit">${g}
    ${lim?`<line class="lim" x1="${L}" x2="${W-R}" y1="${y(lim)}" y2="${y(lim)}"/><line class="pace" x1="${x(0)}" y1="${y(0)}" x2="${x(p.days-1)}" y2="${y(lim)}"/>`:""}
    ${pts.length?`<polygon class="area" points="${x(0)},${y(0)} ${pts.join(" ")} ${x(lastI)},${y(0)}"/><polyline class="spent" points="${pts.join(" ")}"/><circle class="dotp" cx="${x(lastI)}" cy="${y(cum[lastI])}" r="3.5"/>`:""}
    <text x="${L}" y="${H-6}">${fmtD(p.start)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtD(p.end)}</text></svg>`;
}

  </div>
  <div class="card"><h2>Slip reading</h2>
    <div class="field"><label for="st-key">Claude key</label><input id="st-key" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(s.apiKey)}"><span class="hint">Made at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. It is stored only on this phone.</span></div>
    <div class="field"><label for="st-model">Reader</label><select id="st-model">${Object.entries(MODELS).map(([k,v])=>`<option value="${k}" ${k===s.model?"selected":""}>${esc(v)}</option>`).join("")}</select></div>
    <button class="btn" id="st-test">Test the key</button>
    <div id="st-test-out" class="hint" role="status"></div>
  </div>
  <button class="btn primary" id="st-save">Save settings</button>
  <div class="card"><h2>Backup</h2>
    <p class="hint">Slips and photos are kept only on this phone. Make a backup now and then, and keep the file somewhere safe (Google Drive, WhatsApp to yourself). The Claude key is not included.</p>
    <div class="actions"><button class="btn" id="bk-save">Back up</button><button class="btn" id="bk-restore">Restore</button></div>
    <div id="bk-confirm"></div>
    <p class="hint" id="storage-note">${esc(S.storageNote)}</p>
  </div>`;
}

/* ---------- events ---------- */
function bindView(){
  const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)};
  on("su-save","click",async()=>{
    const g=num($("#su-g").value),b=num($("#su-b").value);
    if(!(g>0)){toast("Enter a Groceries limit above zero");return}
    await putSettings({groceriesLimit:g,babyLimit:b>0?b:0,apiKey:$("#su-key").value.trim()});toast("Budgets set");
  });
  on("hm-prev","click",()=>{S.homeKey=shiftKey(S.homeKey,-1);render()});
  on("hm-next","click",()=>{S.homeKey=shiftKey(S.homeKey,1);render()});
  on("hm-now","click",()=>{S.homeKey=curKey();render()});
  let pendingMode=S.settings.babyMode;
  document.querySelectorAll("[data-babymode]").forEach(btn=>btn.addEventListener("click",()=>{
    pendingMode=btn.dataset.babymode;
    document.querySelectorAll("[data-babymode]").forEach(x=>x.setAttribute("aria-pressed",String(x===btn)));
    const f=pendingMode==="fund";
    $("#st-b-label").textContent=f?"Baby Fund total":"Baby Fund limit per month";
    $("#bm-hint").textContent=f?"One total that baby slips come off until it runs out. It does not reset each month.":"Starts fresh every month, like Groceries.";
    $("#fund-start-field").hidden=!f;
  }));
  on("st-save","click",async()=>{
    const g=num($("#st-g").value),b=num($("#st-b").value);
    if(!(g>0)){toast("Enter a Groceries limit above zero");return}
    await putSettings({groceriesLimit:g,babyLimit:b>0?b:0,babyMode:pendingMode,babyFundStart:$("#st-bstart").value||curKey(),
      currency:($("#st-cur").value.trim()||"R").slice(0,4),apiKey:$("#st-key").value.trim(),model:$("#st-model").value});
    toast("Settings saved");
  });
  on("st-test","click",async()=>{
    const out=$("#st-test-out"),btn=$("#st-test"),key=$("#st-key").value.trim();
    if(!key){out.textContent="Paste a key first.";return}
    const keep={apiKey:S.settings.apiKey,model:S.settings.model};
    S.settings.apiKey=key;S.settings.model=$("#st-model").value;
    btn.disabled=true;out.textContent="Checking…";
    try{await askClaude("Reply with the word OK.",5);out.textContent="The key works. Tap Save settings to keep it."}
    catch(e){out.textContent=API_ERR[e.code]||("Claude said: "+(e.message||"unknown error"))}
    finally{Object.assign(S.settings,keep);btn.disabled=false}
  });
  on("scan","click",()=>$("#cam").click());
  on("pick","click",()=>$("#gallery").click());
  on("manual","click",()=>openEditor(null,null));
  on("sheet-period","change",e=>{S.sheetKey=e.target.value;render()});
  on("sheet-year","change",e=>{S.sheetYear=+e.target.value;render()});
  on("export","click",exportMonthCsv);
  on("export-year","click",exportYearCsv);
  on("photos-month","click",e=>savePhotos(inPeriod(periodOfKey(S.sheetKey)),e.currentTarget));
  on("photos-year","click",e=>savePhotos(S.expenses.filter(x=>monthOf(x).startsWith(S.sheetYear+"-")),e.currentTarget));
  on("bk-save","click",backup);
  on("bk-restore","click",()=>$("#restore-file").click());
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{S.filter=b.dataset.filter;render()}));
  document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{S.sheetView=b.dataset.view;render()}));
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{const e=S.expenses.find(x=>x.id===b.dataset.edit);if(e)openEditor(e,null)}));
  if(S.tab==="settings") storageNote();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{S.tab=t.dataset.tab;render();window.scrollTo(0,0)}));
["cam","gallery"].forEach(id=>$("#"+id).addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)openEditor(null,f)}));
$("#restore-file").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)confirmRestore(f)});

/* ---------- editor ---------- */
let readCtl=null;
async function openEditor(exp,file){
  const isNew=!exp,hasKey=!!S.settings.apiKey.trim();
  const d=exp||{merchant:"",amount:"",date:ymd(today()),pot:S.filter!=="all"?S.filter:"groceries",items:[]};
  const slipMonth=exp?monthOf(exp):(S.homeKey||curKey());
  let pot=potOf(d),potTouched=!isNew||S.filter!=="all";
  $("#modal").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${isNew?"Add slip":"Edit slip"}">
    <div class="grab"></div>
    <h2>${isNew?(file?"Check the slip":"Add a purchase"):"Edit slip"}</h2>
    <div id="ed-photo"></div>
    <div id="ed-status" class="status" ${file?"":"hidden"}><span class="spin"></span><span>${file&&hasKey?"Reading the slip…":"Preparing photo…"}</span></div>
    <div class="field"><span class="flabel">Where does it belong?</span>
      <div class="seg" role="group" aria-label="Pot">${POT_IDS.map(k=>`<button data-pot="${k}" aria-pressed="${k===pot}"><span class="dot ${k}"></span>${POTS[k].short}</button>`).join("")}</div>
      <span class="hint" id="ed-pot-hint"></span></div>
    <div class="field"><label for="ed-month">Month it counts in</label><select id="ed-month">${monthChoices(slipMonth).map(k=>`<option value="${k}" ${k===slipMonth?"selected":""}>${monthName(periodOfKey(k))}${k===curKey()?" (this month)":""}</option>`).join("")}</select></div>
    <div class="field"><label for="ed-amount">Total paid</label><input id="ed-amount" class="amtin" inputmode="decimal" value="${d.amount!==""?esc((+d.amount).toFixed(2).replace(".",",")):""}" placeholder="0,00"></div>
    <div class="field"><label for="ed-merchant">Shop or payment</label><input id="ed-merchant" value="${esc(d.merchant)}" placeholder="e.g. Checkers"></div>
    <div class="field"><label for="ed-date">Date on the slip</label><input id="ed-date" type="date" value="${esc(d.date)}"></div>
    <div id="ed-items">${itemsHtml(d.items)}</div>
    <div class="actions">
      <button class="btn" id="ed-cancel">Cancel</button>
      <button class="btn primary" id="ed-save">${isNew?"Save slip":"Save changes"}</button>
      ${isNew?"":`<button class="btn danger wide" id="ed-del">Delete slip</button>`}
    </div></div></div>`;
  const setPot=(k,byUser)=>{
    pot=k;if(byUser)potTouched=true;
    document.querySelectorAll("[data-pot]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pot===k)));
    $("#ed-pot-hint").textContent=k==="extras"?"Adds to your month-end extras. Not deducted from Groceries or Baby Fund.":k==="baby"?(fundMode()?"Comes off the Baby Fund.":"Comes off the Baby Fund limit for the month you choose below."):"Comes off the Groceries limit for the month you choose below.";
    if(isNew)$("#ed-save").textContent=k==="extras"?"Add to month-end":"Deduct from "+POTS[k].name;
  };
  document.querySelectorAll("[data-pot]").forEach(b=>b.addEventListener("click",()=>setPot(b.dataset.pot,true)));
  setPot(pot,false);
  const addedOn=exp?(exp.addedOn||ymd(countDate(exp))):ymd(today());
  let items=d.items||[],photo=null,thumbUrl=null;
  const showPhoto=blob=>{thumbUrl=URL.createObjectURL(blob);$("#ed-photo").innerHTML=`<button class="thumbbtn" id="ed-thumb" aria-label="View photo full size"><img class="thumb" src="${thumbUrl}" alt="Slip photo"></button>`;$("#ed-thumb").onclick=()=>openViewer(blob,exp||{date:$("#ed-date").value,merchant:$("#ed-merchant").value})};
  const close=()=>{if(readCtl){readCtl.abort();readCtl=null}if(thumbUrl)URL.revokeObjectURL(thumbUrl);$("#modal").innerHTML=""};
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
  $("#ed-cancel").addEventListener("click",close);
  const del=$("#ed-del");
  if(del){let armed=false;del.addEventListener("click",async()=>{
    if(!armed){armed=true;del.textContent="Tap again to delete slip and photo";return}
    del.disabled=true;try{await removeExpense(exp.id);close();toast("Slip deleted")}catch(e){del.disabled=false;toast("Couldn't delete. Try again.")}
  })}
  $("#ed-save").addEventListener("click",async()=>{
    const amount=num($("#ed-amount").value),date=$("#ed-date").value;
    if(!(amount>0)){toast("Enter the total paid");$("#ed-amount").focus();return}
    if(!parse(date)){toast("Pick a date");return}
    if(file&&!photo){toast("Still preparing the photo…");return}
    const month=$("#ed-month").value||curKey();
    const row={id:exp?exp.id:newId(),pot,month,merchant:$("#ed-merchant").value.trim().slice(0,80),amount,date,addedOn,items:items.slice(0,40),createdAt:exp?.createdAt||Date.now(),hasPhoto:!!(exp&&exp.hasPhoto)};
    const btn=$("#ed-save");btn.disabled=true;
    try{
      await putExpense(row,photo);close();
      const what=pot==="extras"?"added to month-end":"off "+POTS[pot].name;
      toast((!isNew?"Slip updated":money(amount)+" "+what)+" · "+monthName(periodOfKey(month)));
    }catch(e){btn.disabled=false;toast(e&&e.name==="QuotaExceededError"?"Phone storage is full. Free up space, then try again.":"Couldn't save. Try again.")}
  });
  if(exp&&exp.hasPhoto){const b=await dbGet("photos",exp.id).catch(()=>null);if(b&&$("#ed-photo"))showPhoto(b)}
  if(file){
    const st=$("#ed-status");
    try{photo=await prepPhoto(file)}catch(e){st.className="status err";st.textContent="That photo couldn't be opened. Try another one.";return}
    if(!$("#ed-photo"))return;
    showPhoto(photo);
    if(!hasKey){st.className="status";st.textContent="Photo saved with the slip. Type the total below.";return}
    readSlip(photo,it=>{items=it},k=>{if(!potTouched&&POTS[k])setPot(k,false)});
  }
}
function itemsHtml(items){
  if(!items||!items.length)return "";
  return `<details><summary>${items.length} line item${items.length===1?"":"s"} read from the slip</summary><ul>${items.map(i=>`<li><span>${esc(i.name)}</span><span>${money(+i.amount||0)}</span></li>`).join("")}</ul></details>`;
}
async function readSlip(photo,setItems,suggestPot){
  const st=$("#ed-status");
  const ctl={aborted:false,abort(){this.aborted=true}};readCtl=ctl;
  const prompt=`This photo shows a till slip / receipt or proof of payment (most likely South African, amounts in Rand). Today is ${ymd(today())}.
Extract the purchase. Reply with only a JSON object in this shape:
{"merchant": "store or payee name", "date": "YYYY-MM-DD or null", "total": 123.45, "pot": "groceries | baby | extras", "items": [{"name": "item", "amount": 12.99}]}
Rules: "total" is the final amount actually paid (the TOTAL / AMOUNT DUE line, including VAT, after discounts and savings; ignore change, cash tendered and VAT breakdown lines). Use a number with a dot for decimals. List up to 30 items.
"pot": "baby" if the slip is mainly baby things (nappies, formula, baby food, wipes, baby clothes, baby shops like Baby City); "groceries" if it is mainly food and household groceries from a supermarket; otherwise "extras".
If the year is missing, pick the most recent date that is not after today. If the image is not a receipt, reply {"error": "not a receipt"}.`;
  try{
    const b64=await blobToB64(photo);
    const text=await askClaude([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt}],1500);
    if(ctl.aborted||!document.getElementById("ed-status"))return;
    const r=extractJSON(text);
    if(!r||r.error||!(num(r.total)>0))throw {code:"notslip"};
    const amt=$("#ed-amount");if(!amt.value)amt.value=num(r.total).toFixed(2).replace(".",",");
    if(r.merchant&&!$("#ed-merchant").value)$("#ed-merchant").value=String(r.merchant).slice(0,80);
    const d=parse(r.date);if(d&&d<=today()&&dayDiff(d,today())<400)$("#ed-date").value=ymd(d);
    if(typeof r.pot==="string")suggestPot(r.pot.trim().toLowerCase());
    const it=Array.isArray(r.items)?r.items.filter(i=>i&&i.name).map(i=>({name:String(i.name).slice(0,60),amount:num(i.amount)||0})).slice(0,30):[];
    setItems(it);$("#ed-items").innerHTML=itemsHtml(it);
    st.className="status";st.textContent="Read by Claude. Check the total and the pot, then save.";
  }catch(e){
    if(ctl.aborted||!document.getElementById("ed-status"))return;
    st.className="status err";st.textContent=API_ERR[e.code]||("Couldn't read the slip: "+(e.message||"unknown error")+". Enter the total by hand.");
  }finally{if(readCtl===ctl)readCtl=null}
}

/* ---------- export, backup, restore ---------- */
const csvq=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
const csvBlob=rows=>new Blob(["﻿"+rows.map(r=>r.map(csvq).join(",")).join("\r\n")],{type:"text/csv"});
async function exportMonthCsv(){
  const p=periodOfKey(S.sheetKey),list=inPeriod(p).sort((a,b)=>a.date.localeCompare(b.date)),s=S.settings;
  const gl=+s.groceriesLimit||0,bl=+s.babyLimit||0,gs=potSum(list,"groceries"),bs=potSum(list,"baby"),xs=potSum(list,"extras");
  const rows=[["Month",monthName(p)],[],["Date on slip","Shop / payment","Pot","Amount"]];
  list.forEach(e=>rows.push([e.date,e.merchant,POTS[potOf(e)].name,(+e.amount).toFixed(2)]));
  rows.push([],["Pot","Spent","Limit","Left"],
    ["Groceries",gs.toFixed(2),gl.toFixed(2),(gl-gs).toFixed(2)],
    fundMode()?["Baby Fund (running fund)",bs.toFixed(2),bl.toFixed(2),(bl-babyFundSpent()).toFixed(2)]:["Baby Fund",bs.toFixed(2),bl?bl.toFixed(2):"",bl?(bl-bs).toFixed(2):""],
    ["End of month payments (extras)",xs.toFixed(2),"",""],
    ["Total",(gs+bs+xs).toFixed(2),"",""]);
  if(!await saveFile(`slipwise-${p.key}-${MONTHS[p.start.getMonth()]}.csv`,csvBlob(rows)))toast("Sheet saved to Downloads");
}
async function exportYearCsv(){
  const y=S.sheetYear,rows=[["Year",String(y)],[],["Month","Groceries","Baby Fund","End of month payments","Total"]];
  const yr=yearRows(y);let g=0,b=0,x=0;
  yr.forEach(r=>{g+=r.g;b+=r.b;x+=r.x;rows.push([r.name,r.g.toFixed(2),r.b.toFixed(2),r.x.toFixed(2),(r.g+r.b+r.x).toFixed(2)])});
  rows.push(["Total",g.toFixed(2),b.toFixed(2),x.toFixed(2),(g+b+x).toFixed(2)]);
  if(!await saveFile(`slipwise-${y}.csv`,csvBlob(rows)))toast("Year sheet saved to Downloads");
}
// Save every photo in the list to the phone's Pictures/Slipwise/<Month Year> folder in one go
async function savePhotos(list,btn){
  const todo=list.filter(e=>e.hasPhoto).sort((a,b)=>monthOf(a).localeCompare(monthOf(b))||a.date.localeCompare(b.date));
  if(!todo.length){toast("No photos in this period");return}
  const label=btn.textContent;btn.disabled=true;
  const clean=t=>String(t||"").replace(/[^\w .&'-]+/g," ").replace(/\s+/g," ").trim().slice(0,40);
  const used=new Set();let ok=0;const folders=new Set();
  try{
    for(let i=0;i<todo.length;i++){
      const e=todo[i];btn.textContent=`Saving ${i+1} of ${todo.length}…`;
      const blob=await dbGet("photos",e.id);if(!blob)continue;
      const folder=monthName(periodOfKey(monthOf(e)));folders.add(folder);
      let name=`${e.date} ${clean(e.merchant)||"Slip"} R${(+e.amount).toFixed(2)} ${POTS[potOf(e)].short}`;
      let n=name,k=2;while(used.has(folder+"/"+n)){n=name+" ("+(k++)+")"}used.add(folder+"/"+n);
      if(window.AndroidBridge&&window.AndroidBridge.savePhoto){
        if(window.AndroidBridge.savePhoto(n+".jpg",await blobToB64(blob),folder))ok++;
      }else{await saveFile(n+".jpg",blob);ok++;await new Promise(r=>setTimeout(r,350))}
    }
    const where=window.AndroidBridge?(folders.size===1?`Pictures › Slipwise › ${[...folders][0]}`:"Pictures › Slipwise"):"Downloads";
    toast(ok===todo.length?`Saved ${ok} photo${ok===1?"":"s"} to ${where}`:ok?`Saved ${ok} of ${todo.length} photos to ${where}`:"Couldn't save the photos. Allow storage access and try again.");
  }catch(err){toast("Saving stopped part-way. Try again.")}
  finally{btn.disabled=false;btn.textContent=label}
}
async function backup(){
  const btn=$("#bk-save");btn.disabled=true;btn.textContent="Packing…";
  try{
    const photos={};
    for(const e of S.expenses){if(e.hasPhoto){const b=await dbGet("photos",e.id);if(b)photos[e.id]=await blobToDataURL(b)}}
    const s=Object.assign({},S.settings);delete s.apiKey;
    const data={app:"slipwise",version:2,made:new Date().toISOString(),settings:s,expenses:S.expenses,photos};
    if(!await saveFile(`slipwise-backup-${ymd(today())}.json`,new Blob([JSON.stringify(data)],{type:"application/json"})))toast("Backup saved to Downloads");
  }catch(e){toast("Couldn't make the backup. Try again.")}
  finally{btn.disabled=false;btn.textContent="Back up"}
}
async function confirmRestore(file){
  let data;
  try{data=JSON.parse(await file.text());if(data.app!=="slipwise"||!Array.isArray(data.expenses))throw 0}
  catch(e){toast("That file isn't a Slipwise backup.");return}
  const box=$("#bk-confirm");if(!box)return;
  box.innerHTML=`<div class="banner">Restore ${data.expenses.length} slips from ${esc((data.made||"").slice(0,10))}? Slips already on this phone stay; matching ones are replaced. <div class="actions" style="margin-top:10px"><button class="btn small" id="rs-no">Cancel</button><button class="btn small primary" id="rs-yes">Restore</button></div></div>`;
  $("#rs-no").onclick=()=>box.innerHTML="";
  $("#rs-yes").onclick=async()=>{
    $("#rs-yes").disabled=true;
    try{
      for(const e of data.expenses){
        if(!e||!e.id||!parse(e.date))continue;
        const url=data.photos&&data.photos[e.id];
        if(url){const b=await (await fetch(url)).blob();await dbPut("photos",b,e.id);e.hasPhoto=true}
        await dbPut("expenses",e);
      }
      if(data.settings){const keep=S.settings.apiKey;S.settings=Object.assign(migrateSettings(data.settings),{apiKey:keep});await dbPut("kv",S.settings,"settings")}
      S.expenses=await dbAll("expenses");render();toast("Backup restored");
    }catch(e){toast("Restore stopped part-way. Try again.")}
  };
}
async function storageNote(){
  const n=S.expenses.filter(e=>e.hasPhoto).length;let t=`${S.expenses.length} slips, ${n} photos saved on this phone.`;
  try{const est=await navigator.storage.estimate();if(est&&est.usage)t+=` Using about ${(est.usage/1048576).toFixed(1)} MB.`}catch(e){}
  S.storageNote=t;const el=$("#storage-note");if(el)el.textContent=t;
}

/* ---------- boot ---------- */
render();
(async()=>{
  try{
    idb=await openDB();
    const s=await dbGet("kv","settings");if(s)S.settings=migrateSettings(s);
    S.expenses=await dbAll("expenses");
  }catch(e){toast("This phone can't store data in the app. Try reinstalling it.")}
  S.ready=true;render();
})();
if(!window.AndroidBridge&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
